plugins {
    id 'com.android.application'
}

android {
    namespace 'com.invaliddev403.gtvremote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.invaliddev403.gtvremote'
        minSdk 28
        targetSdk 36
        versionCode 9
        versionName '2.0.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
